<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#08090e" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGlow)" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Outer Ring -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Middle Dashed Ring -->
  <circle cx="64" cy="64" r="36" fill="none" stroke="#818cf8" stroke-width="3" stroke-dasharray="14 7" stroke-linecap="round" opacity="0.9" />

  <!-- Core Inverted Triangle -->
  <polygon points="64,38 90,82 38,82" fill="#38bdf8" opacity="0.85" filter="url(#glow)" />
  <polygon points="64,43 84,78 44,78" fill="#08090e" opacity="0.75" />

  <!-- Central Arc Core Node -->
  <circle cx="64" cy="64" r="16" fill="url(#coreGlow)" />
  <circle cx="64" cy="64" r="8" fill="#ffffff" filter="url(#glow)" />
</svg>
